services:
  zoho-backup:
    build: .
    image: kpa90/zoho-mail-api-backup:latest
    container_name: zoho-backup
    restart: unless-stopped
    environment:
      # api-console.zoho.eu -> Self Client -> scope:
      # ZohoMail.messages.READ,ZohoMail.folders.READ,ZohoMail.accounts.READ
      ZOHO_CLIENT_ID: ""
      ZOHO_CLIENT_SECRET: ""
      ZOHO_REFRESH_TOKEN: ""
      ZOHO_DC: eu                 # region konta: eu | com | in | com.au | jp
      TZ: Europe/Warsaw           # wedlug tej strefy liczy sie ZIP_CRON
      SYNC_INTERVAL_HOURS: 6      # co ile godzin dociagac nowe maile
      ZIP_CRON: "30 23 * * 0"     # zip ze stanem skrzynki: niedziela 23:30
      REQ_INTERVAL: 2.1           # sekundy miedzy requestami: 60/2.1 = ~28/min
                                  # (limit Zoho to 30/min; wpisz 3 zeby zejsc do 20/min)
    volumes:
      - ./data:/data              # data/mail/<folder>/*.eml  +  data/zips/*.zip
